services:
  postgres:
    image: postgres:16-alpine
    container_name: exercicio6_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exercicio6
      POSTGRES_USER: orange
      POSTGRES_PASSWORD: orange123
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dump_exercicio6.sql:/docker-entrypoint-initdb.d/01-dump_exercicio6.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orange -d exercicio6"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
